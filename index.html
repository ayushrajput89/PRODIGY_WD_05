<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <h1 class="app-title">Weather App</h1>
        <main class="main-container">
            <header class="input-container">
                <input class="city-input" placeholder="Search City" type="text"> 
                <button class="search-btn" aria-label="Search">
                    <span class="material-symbols-outlined">search</span>
                </button>
            </header>

            <section class="weather-info" style="display: none;">
                <div class="weather-content-grid">
                    <div class="weather-current-wrapper">
                        <div class="location-date-container">
                            <div class="location">
                                <span class="material-symbols-outlined">location_on</span>
                                <h4 class="country-txt">Jakarta</h4>
                            </div>
                            <h5 class="current-date-txt regular-txt">Wed, 07 Aug</h5>
                        </div>
                    
                        <div class="weather-summary-container">
                            <img src="assets/weather/clouds.svg" class="weather-summary-img" alt="Weather Condition">
                            <div class="weather-summary-info">
                                <h1 class="temp-txt">29 ℃</h1>
                                <h3 class="condition-txt regular-txt">Clouds</h3>
                            </div>
                        </div>
                        
                        <div class="weather-conditions-container">
                            <div class="condition-card">
                                <span class="material-symbols-outlined">water_drop</span>
                                <div class="condition-info">
                                    <h5 class="regular-txt">Humidity</h5>
                                    <h5 class="humidity-value-txt">55%</h5>
                                </div>
                            </div>
                            <div class="condition-card">
                                <span class="material-symbols-outlined">air</span>
                                <div class="condition-info">
                                    <h5 class="regular-txt">Wind Speed</h5>
                                    <h5 class="wind-value-txt">2 M/s</h5>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="forecast-wrapper">
                        <h3 class="forecast-title">5-Day Forecast</h3>
                        <div class="forcast-items-container">
                            <!-- Injected via JS -->
                        </div>
                    </div>
                </div>
            </section>

            <section class="search-city section-message">
                <span class="material-symbols-outlined" style="font-size: 120px; color: rgba(255, 255, 255, 0.9); margin-bottom: 20px; text-shadow: 0 4px 6px rgba(0,0,0,0.2);">travel_explore</span>
                <div>
                    <h1>Search City</h1>
                    <h4 class="regular-txt">Find out the weather conditions of the city</h4>
                </div>
            </section> 

            <section class="not-found-city section-message" style="display: none;">
                <span class="material-symbols-outlined" style="font-size: 120px; color: rgba(255, 255, 255, 0.9); margin-bottom: 20px; text-shadow: 0 4px 6px rgba(0,0,0,0.2);">error</span>
                <div>
                    <h1>Incorrect City Name</h1>
                    <h4 class="regular-txt">Could not find weather for this location</h4>
                </div>
            </section> 
        </main>
    </div>
</body>
</html>
